<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Mode - Loci Intellectus</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            justify-content: center;
            background-color: #f5f5f5;
        }
        .offline-card {
            padding: 40px 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body class="center-align">

    <div class="container">
        <div class="row">
            <div class="col s12 m8 offset-m2 l6 offset-l3">
                <div class="card offline-card z-depth-2 white">
                    <div class="card-content">
                        <i class="material-icons large orange-text text-darken-3">cloud_off</i>
                        <h4 class="indigo-text text-darken-4" style="font-weight: 300; margin-top: 10px;">
                            You are currently offline
                        </h4>
                        <p class="flow-text grey-text text-darken-2" style="font-size: 1.1rem; margin-top: 20px;">
                            Your network connection dropped, but <strong>Loci Intellectus</strong> shields your flow state. Previously synced flashcard repositories and your core timing dashboard remain fully operable.
                        </p>
                    </div>
                    <div class="card-action" style="border-top: none; padding-top: 0;">
                        <button class="btn btn-large indigo waves-effect waves-light" onclick="window.location.reload();">
                            <i class="material-icons left">refresh</i>Retry Reconnection
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cloudflare.com"></script>
</body>
</html>
